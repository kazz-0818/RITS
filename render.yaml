# Render Blueprint — RITS Web + 日次オーナー push 用 Cron
# Cron は UTC 0:00 = JST 9:00 に Web の /admin/reports/daily/push-owner を叩く（無料 Web のスリープ対策）

envVarGroups:
  - name: rits-secrets
    envVars:
      - key: ADMIN_API_KEY
        sync: false

services:
  - type: web
    name: rits
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - fromGroup: rits-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_OWNER_USER_ID
        sync: false
      - key: DAILY_OWNER_PUSH_TIME_JST
        value: "09:00"
      # 本番の定期 push は Cron に任せる（Web 常時起動時の二重送信を避ける）
      - key: DAILY_OWNER_PUSH_ENABLED
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false

  - type: cron
    name: rits-daily-owner-push
    runtime: node
    plan: free
    region: oregon
    # 毎日 00:00 UTC = 09:00 JST（日本はサマータイムなし）
    schedule: "0 0 * * *"
    buildCommand: npm install && npm run build
    startCommand: node dist/scripts/cronDailyOwnerPush.js
    envVars:
      - fromGroup: rits-secrets
      - key: RITS_WEB_HOST
        fromService:
          type: web
          name: rits
          property: host
